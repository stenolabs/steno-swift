name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test shared core
        run: swift test --package-path StenoKit

      - name: Test macOS app
        run: |
          xcodegen generate
          xcodebuild -project Steno.xcodeproj -scheme Steno \
            -destination 'platform=macOS' test

      - name: Test iOS app
        working-directory: iOS
        run: |
          xcodegen generate
          xcodebuild -project StenoiOS.xcodeproj -scheme Steno \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/DerivedData test

      - name: Test iOS audio package
        working-directory: iOS/StenoiOSKit
        run: |
          xcodebuild -scheme StenoiOSKit \
            -destination 'platform=iOS Simulator,name=iPhone 17' test
